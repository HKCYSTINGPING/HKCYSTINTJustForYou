name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/fonts _site/assets _site/assets/trophies
          cp index.html app.js firebase-data.js firebase-config.js styles.css participants.json manifest.json sw.js .nojekyll _site/
          cp fonts/CanvaHandwritingStyleTC.woff2 _site/fonts/
          cp assets/*.png _site/assets/
          cp assets/*.pdf _site/assets/ 2>/dev/null || true
          cp assets/trophies/*.png _site/assets/trophies/ 2>/dev/null || true
          # Bust browser / CDN caches on every Pages deploy (incl. font).
          SHA="$(git rev-parse --short HEAD)"
          python3 - "$SHA" <<'PY'
          import pathlib, re, sys
          ver = sys.argv[1]
          root = pathlib.Path('_site')
          html = (root / 'index.html').read_text(encoding='utf-8')
          html = re.sub(r'href="styles\.css(?:\?v=[^"]*)?"', f'href="styles.css?v={ver}"', html)
          html = re.sub(r'href="fonts/CanvaHandwritingStyleTC\.woff2(?:\?v=[^"]*)?"', f'href="fonts/CanvaHandwritingStyleTC.woff2?v={ver}"', html)
          html = re.sub(r'src="app\.js(?:\?v=[^"]*)?"', f'src="app.js?v={ver}"', html)
          html = html.replace('</title>', f'</title>\n  <!-- build {ver} -->', 1)
          (root / 'index.html').write_text(html, encoding='utf-8')
          app = (root / 'app.js').read_text(encoding='utf-8')
          app = re.sub(r"from '\./firebase-data\.js(?:\?v=[^']*)?'", f"from './firebase-data.js?v={ver}'", app)
          (root / 'app.js').write_text(app, encoding='utf-8')
          data = (root / 'firebase-data.js').read_text(encoding='utf-8')
          data = re.sub(r"from '\./firebase-config\.js(?:\?v=[^']*)?'", f"from './firebase-config.js?v={ver}'", data)
          (root / 'firebase-data.js').write_text(data, encoding='utf-8')
          css = (root / 'styles.css').read_text(encoding='utf-8')
          css = re.sub(
              r'url\("fonts/CanvaHandwritingStyleTC\.woff2(?:\?v=[^"]*)?"\)',
              f'url("fonts/CanvaHandwritingStyleTC.woff2?v={ver}")',
              css
          )
          (root / 'styles.css').write_text(css, encoding='utf-8')
          print(f'Cache bust version: {ver}')
          PY
          grep -q "styles.css?v=${SHA}" _site/index.html
          grep -q "app.js?v=${SHA}" _site/index.html
          for f in index.html app.js firebase-data.js firebase-config.js styles.css participants.json manifest.json sw.js fonts/CanvaHandwritingStyleTC.woff2 assets/trophy.png assets/heart.png assets/trophies/t01.png assets/achievement-handbook.pdf; do
            test -s "_site/$f" || { echo "缺少 $f"; exit 1; }
          done
          test "$(ls _site/assets/trophies/t0*.png 2>/dev/null | wc -l | tr -d ' ')" -ge 8 || { echo "獎項貼圖不足 8 張"; exit 1; }
          test "$(ls _site/assets/*.png | wc -l | tr -d ' ')" -ge 20 || { echo "assets 圖示數量不足"; exit 1; }

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
          enable_jekyll: false
