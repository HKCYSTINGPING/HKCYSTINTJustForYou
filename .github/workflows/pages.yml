name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site/fonts
          cp index.html app.js firebase-data.js firebase-config.js styles.css participants.json .nojekyll _site/
          cp fonts/CanvaHandwritingStyleTC.woff2 _site/fonts/
          # A missing module would only surface as a blank page in someone's
          # browser, so fail the deploy here instead.
          for f in index.html app.js firebase-data.js firebase-config.js styles.css participants.json fonts/CanvaHandwritingStyleTC.woff2; do
            test -s "_site/$f" || { echo "缺少 $f"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
